AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  pdf-extractor-lambda

  Función Lambda para extraer texto de archivos PDF subidos a S3 Express One Zone

Parameters:
  PineconeSecretArn:
    Type: String
    Description: ARN del secreto de Secrets Manager que contiene apiKey o PINECONE_API_KEY
  PineconeIndexHost:
    Type: String
    Description: Host HTTPS del índice Pinecone, sin https:// final
  PineconeNamespace:
    Type: String
    Default: documents-dev
    Description: Namespace donde se almacenarán los chunks

Resources:
  PdfTextExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.example.PdfTextExtractor::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          PINECONE_SECRET_ARN: !Ref PineconeSecretArn
          PINECONE_INDEX_HOST: !Ref PineconeIndexHost
          PINECONE_NAMESPACE: !Ref PineconeNamespace
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:*
                - s3express:*
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref PineconeSecretArn

Outputs:
  PdfTextExtractorFunctionArn:
    Description: "ARN de la función Lambda de extracción de PDF"
    Value: !GetAtt PdfTextExtractorFunction.Arn
