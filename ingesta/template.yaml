AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  pdf-extractor-lambda

  Funcion Lambda que extrae texto de PDFs subidos a S3, divide en chunks
  y los indexa en Pinecone. Se dispara automaticamente con el evento
  s3:ObjectCreated sobre archivos .pdf del prefijo documents/.

# ---------------------------------------------------------------------------
# Parametros: valores que se pasan en el deploy con --parameter-overrides.
# No se escriben en el template para no fijar secretos ni nombres en el codigo.
# ---------------------------------------------------------------------------
Parameters:
  BucketName:
    Type: String
    Description: Nombre del bucket donde se guardan los PDFs (prefijo documents/)
  PineconeSecretArn:
    Type: String
    Description: ARN del secreto de Secrets Manager que contiene apiKey o PINECONE_API_KEY
  PineconeIndexHost:
    Type: String
    Description: Host HTTPS del indice Pinecone, sin https:// final
  PineconeNamespace:
    Type: String
    Default: documents-dev
    Description: Namespace donde se almacenaran los chunks
  PineconeTextField:
    Type: String
    Default: text
    Description: Campo del registro que el indice mapea para embedding (field_map)
  CognitoUserPoolId:
    Type: String
    Description: ID del User Pool que emite los ID Tokens
  CognitoAppClientId:
    Type: String
    Description: ID del App Client publico usado por el frontend
  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Origen(es) permitidos por CORS separados por coma (ej. "http://localhost:3000,https://app.vercel.app")
  DocumentsUserIndex:
    Type: String
    Default: user-updated-index
    Description: Nombre del indice secundario para listar documentos por usuario

Resources:
  # -------------------------------------------------------------------------
  # Bucket de documentos: aqui se suben los PDFs. El nombre es global en AWS,
  # por eso se recibe como parametro en vez de inventarlo dentro del template.
  # -------------------------------------------------------------------------
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [",", !Ref FrontendOrigin]
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: !Ref DocumentsUserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.example.UploadUrlHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_USER_INDEX: !Ref DocumentsUserIndex
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub '${DocumentsBucket.Arn}/documents/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: !Split [",", !Ref FrontendOrigin]
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
            - Authorization

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.example.DocumentHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_USER_INDEX: !Ref DocumentsUserIndex
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
          PINECONE_SECRET_ARN: !Ref PineconeSecretArn
          PINECONE_INDEX_HOST: !Ref PineconeIndexHost
          PINECONE_NAMESPACE: !Ref PineconeNamespace
          PINECONE_TEXT_FIELD: !Ref PineconeTextField
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${DocumentsBucket.Arn}/documents/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt DocumentsTable.Arn
                - !Sub '${DocumentsTable.Arn}/index/${DocumentsUserIndex}'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref PineconeSecretArn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: !Split [",", !Ref FrontendOrigin]
          AllowMethods:
            - GET
            - DELETE
          AllowHeaders:
            - Content-Type
            - Authorization

  # -------------------------------------------------------------------------
  # Funcion Lambda: orquesta todo el flujo de ingesta. No contiene la logica
  # detallada de extraccion, chunking ni HTTP; esos pasos viven en las clases
  # PdfTextExtractor, TextChunker y PineconeClient del JAR.
  # -------------------------------------------------------------------------
  PdfTextExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      # El codigo es el proyecto completo; Maven construye el JAR al hacer build.
      CodeUri: .
      # Clase y metodo de entrada que ejecuta Lambda al despertar.
      Handler: com.example.PdfTextExtractor::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      # 1 GB de RAM y hasta 2 minutos: un PDF grande con muchos chunks necesita
      # memoria y tiempo para extraer, dividir y enviar todo a Pinecone.
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          # La Lambda solo conoce el ARN del secreto; la API key se consulta
          # por IAM y nunca se escribe en codigo ni en logs.
          PINECONE_SECRET_ARN: !Ref PineconeSecretArn
          PINECONE_INDEX_HOST: !Ref PineconeIndexHost
          PINECONE_NAMESPACE: !Ref PineconeNamespace
          # Campo que el indice usa para embedding. En rag-index es "text";
          # si el indice cambiara de field_map, solo se cambia este parametro.
          PINECONE_TEXT_FIELD: !Ref PineconeTextField
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_USER_INDEX: !Ref DocumentsUserIndex
      Policies:
        - Statement:
            # La Lambda solo necesita leer los PDFs del bucket configurado.
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/documents/*'
            # Acceso minimo a secretos: solo puede leer el secreto de Pinecone,
            # nunca otros secretos de la cuenta.
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref PineconeSecretArn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        # Trigger de ingesta: despierta la Lambda SOLO cuando se crea un objeto
        # en el bucket que cumpla los dos filtros (prefijo documents/ y .pdf).
        # Un .jpg o un archivo fuera de documents/ no invoca nada.
        PdfCreatedEvent:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: documents/
                  - Name: suffix
                    Value: .pdf

Outputs:
  # Salidas utiles para el operador: aparecen al final del sam deploy.
  PdfTextExtractorFunctionArn:
    Description: "ARN de la funcion Lambda de extraccion de PDF"
    Value: !GetAtt PdfTextExtractorFunction.Arn
  DocumentsBucketName:
    Description: "Bucket S3 donde se suben los PDFs (prefijo documents/)"
    Value: !Ref DocumentsBucket
  UploadFunctionUrl:
    Description: "URL para solicitar URLs S3 prefirmadas"
    Value: !GetAtt UploadUrlFunctionUrl.FunctionUrl
  DocumentsFunctionUrl:
    Description: "URL para listar y visualizar documentos del usuario"
    Value: !GetAtt DocumentsFunctionUrl.FunctionUrl
