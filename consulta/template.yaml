AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  consulta-rag-lambda

  Microservicio de consulta RAG: recibe preguntas via Lambda Function URL,
  recupera contexto de Pinecone (busqueda vectorial), genera la respuesta con
  DeepSeek via OpenRouter y guarda las sesiones en DynamoDB.

Parameters:
  PineconeSecretArn:
    Type: String
    Description: ARN del secreto de Secrets Manager con la API key de Pinecone
  PineconeIndexHost:
    Type: String
    Description: Host HTTPS del indice Pinecone, sin https:// final
  PineconeNamespace:
    Type: String
    Default: documents-dev
    Description: Namespace donde estan los chunks indexados
  PineconeTextField:
    Type: String
    Default: text
    Description: Campo del registro que el indice mapea para embedding (field_map)
  OpenRouterSecretArn:
    Type: String
    Description: ARN del secreto de Secrets Manager con la API key de OpenRouter (apiKey)
  OpenRouterModel:
    Type: String
    Default: nvidia/nemotron-3-ultra-550b-a55b:free
    Description: Modelo LLM a usar en OpenRouter (los modelos free terminan en :free)
  CorsAllowedOrigins:
    Type: String
    Default: "*"
    Description: Origen(es) permitidos por CORS, separados por coma (ej. "*" o "https://app.com,http://localhost:5173")
  SessionsUserIndex:
    Type: String
    Default: user-updated-index
    Description: Nombre del indice secundario para listar sesiones por usuario
  # Parametros opcionales de Cognito (si no se pasan se crean UserPool y AppClient nuevos)
  CognitoUserPoolName:
    Type: String
    Default: rag-user-pool
    Description: Nombre del User Pool de Cognito para autenticacion de usuarios
  CognitoMfaEnabled:
    Type: String
    Default: "OFF"
    AllowedValues: ["OFF", "OPTIONAL"]
    Description: "OFF = sin MFA, OPTIONAL = MFA disponible por usuario"

Resources:
  # -------------------------------------------------------------------------
  # User Pool de Cognito: directorio de usuarios con verificacion de email.
  # Emite ID Tokens (JWT RS256) que la Lambda verifica en cada request.
  # -------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref CognitoUserPoolName
      # El email es el atributo de login y se verifica automaticamente.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Politica de contrasenas robusta.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: !Ref CognitoMfaEnabled
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
      AdminCreateUserConfig:
        # Permite que los usuarios se registren solos (sin que un admin los cree).
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # -------------------------------------------------------------------------
  # App Client publico (sin client_secret): usado por SPA / apps moviles.
  # Flujos habilitados: USER_SRP_AUTH (login normal) + REFRESH_TOKEN_AUTH.
  # -------------------------------------------------------------------------
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: rag-app-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # Solo flujos seguros: SRP (password sin enviar en claro) y refresh token.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      # Validez de los tokens.
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # -------------------------------------------------------------------------
  # Tabla de sesiones: una fila por sesion de chat con el historial completo.
  # Facturacion on-demand (pay per request), ideal para uso esporadico.
  # -------------------------------------------------------------------------
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: !Ref SessionsUserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  # -------------------------------------------------------------------------
  # Funcion Lambda de consulta: orquesta busqueda vectorial + LLM + sesion.
  # La URL de la funcion (Function URL) es el punto de entrada publico:
  # gratis (no paga por request), contrato OpenAI-compatible via APIGatewayV2HTTPEvent.
  # -------------------------------------------------------------------------
  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.example.QueryHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          PINECONE_SECRET_ARN: !Ref PineconeSecretArn
          PINECONE_INDEX_HOST: !Ref PineconeIndexHost
          PINECONE_NAMESPACE: !Ref PineconeNamespace
          PINECONE_TEXT_FIELD: !Ref PineconeTextField
          OPENROUTER_SECRET_ARN: !Ref OpenRouterSecretArn
          OPENROUTER_MODEL: !Ref OpenRouterModel
          SESSIONS_TABLE: !Ref SessionsTable
          SESSIONS_USER_INDEX: !Ref SessionsUserIndex
          # IDs del User Pool y App Client inyectados para validacion JWT en-process.
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PineconeSecretArn
                - !Ref OpenRouterSecretArn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: !Split [",", !Ref CorsAllowedOrigins]
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
            - Authorization

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.example.SessionHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          SESSIONS_USER_INDEX: !Ref SessionsUserIndex
          HISTORY_TURNS: 6
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt SessionsTable.Arn
                - !Sub '${SessionsTable.Arn}/index/${SessionsUserIndex}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: !Split [",", !Ref CorsAllowedOrigins]
          AllowMethods:
            - GET
            - DELETE
          AllowHeaders:
            - Content-Type
            - Authorization

Outputs:
  QueryFunctionUrl:
    Description: "URL publica del microservicio de consulta (POST /query)"
    Value: !GetAtt QueryFunctionUrl.FunctionUrl
  SessionFunctionUrl:
    Description: "URL para listar, consultar y eliminar conversaciones"
    Value: !GetAtt SessionFunctionUrl.FunctionUrl
  SessionsTableName:
    Description: "Tabla DynamoDB de sesiones"
    Value: !Ref SessionsTable
  UserPoolId:
    Description: "ID del User Pool de Cognito (para configurar el frontend)"
    Value: !Ref UserPool
  AppClientId:
    Description: "ID del App Client de Cognito (para configurar el frontend)"
    Value: !Ref UserPoolClient
  UserPoolProviderUrl:
    Description: "URL del proveedor OIDC del User Pool (para validacion de tokens)"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
